name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-app

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e test
        run: ./mvnw -B verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile_v2

  docker:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build immagine
        run: |
          BRANCH_TAG=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          docker build -f Dockerfile_v2 -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$BRANCH_TAG" .
      - name: Scan Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}:${{ github.sha }}
          only-severities: critical
          only-fixed: true
          exit-code: true
      - name: Push su Docker Hub
        run: docker push --all-tags "$IMAGE"

  pages:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Compila la pagina
        run: |
          sed -i "s|__SHA__|${GITHUB_SHA:0:7}|g" site/index.html
          sed -i "s|__ACTOR__|$GITHUB_ACTOR|g" site/index.html
          sed -i "s|__DATE__|$(date -u '+%d/%m/%Y %H:%M UTC')|g" site/index.html
          sed -i "s|__IMAGE__|$IMAGE|g" site/index.html
          sed -i "s|__RUN_URL__|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
