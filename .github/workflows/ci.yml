name: CI/CD

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'k8s/**'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-app

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e test
        run: ./mvnw -B verify

  docker:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker image
        run: |
          BRANCH_TAG=$(echo "$GITHUB_REF_NAME" | tr '/' '-' )
          docker build -f Dockerfile_v2 --provenance=false -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$BRANCH_TAG" .
      - name: Scan Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}:${{ github.sha }}
          only-severities: critical
          only-fixed: true
          exit-code: true
      - name: Push su Docker hub
        run: docker push --all-tags "$IMAGE"

  deploy:
    needs: docker
    if: github.ref == 'refs/hand/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Nuova immagine del deployment
        run : |
          sed -i "s|image: .*|image: $IMAGE:$GITHUB_SHA|" k8s/default/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: devops-app ${GITHUB_SHA:0:7}"
          git push